<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deteccion_Carros Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Deteccion_Carros</h1>
      <p>Eventos vehiculares en tiempo real</p>
    </div>
    <button id="refreshBtn" type="button">Actualizar</button>
  </header>

  <main>
    <section class="stats-grid" aria-label="Estadísticas del día">
      <article class="stat-card">
        <span>Entradas hoy</span>
        <strong id="entradasHoy">0</strong>
      </article>
      <article class="stat-card">
        <span>Salidas hoy</span>
        <strong id="salidasHoy">0</strong>
      </article>
      <article class="stat-card">
        <span>Total vehículos</span>
        <strong id="totalVehiculos">0</strong>
      </article>
    </section>

    <section class="chart-section">
      <div class="section-header">
        <h2>Vehículos por hora</h2>
      </div>
      <div class="chart-wrap">
        <canvas id="hourlyChart"></canvas>
      </div>
    </section>

    <section class="events-section">
      <div class="section-header">
        <h2>Últimos eventos</h2>
        <span id="statusText">Cargando...</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Placa</th>
              <th>Tipo</th>
              <th>Imagen</th>
            </tr>
          </thead>
          <tbody id="eventsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
